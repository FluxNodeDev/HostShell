name: Bug report
description: 报告一个可以复现的问题
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供可复现的信息，方便快速定位。
  - type: input
    id: version
    attributes:
      label: HostShell 版本
      description: 设置 → 关于 里可以看到，或看安装包文件名
      placeholder: 0.17.4
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows 10/11
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (AppImage)
        - Linux (deb)
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 出现...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 vs 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 截图 / 日志（可选）
      description: 可直接拖拽图片；终端报错请贴文本
    validations:
      required: false
